[package]
name = "veil-browser"
version = "0.8.0"
edition = "2021"
description = "Veil Browser: a privacy-first experimental desktop browser with the independent Veil Engine"
license = "MIT"

[lib]
name = "veil_engine"
path = "src/lib.rs"

[[bin]]
name = "veil-browser"
path = "src/main.rs"

[[bin]]
name = "veil-engine"
path = "src/bin/veil_engine.rs"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
httpdate = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
