name: Apply Veil 0.8.5 Gecko Image Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Keep workflow packaging outside the bot commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/veil_085_gecko_image_fix.py")
          text = path.read_text()
          marker = "# Normal installer should package the tested version after this workflow commits."
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + "\n"
          path.write_text(text)
          PY

      - name: Apply Gecko-inspired image pipeline fix
        run: python3 tools/veil_085_gecko_image_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Commit tested source
        run: |
          rm -f tools/veil_085_gecko_image_fix.py
          git add Cargo.toml Cargo.lock src/net.rs src/image_loader.rs src/main.rs src/engine.rs
          git add -u -- tools/veil_085_gecko_image_fix.py
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Rebuild Veil image pipeline from Gecko behavior"
          git push origin HEAD:main
