name: Apply Veil 0.8.7 Gecko Architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Fix duplicate renderer mapping staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/veil_087_gecko_architecture.py")
          text = path.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")\n    p.write_text(text.replace(old, new, 1))'''
          new = '''    renderer_runtime_mapping = (\n        path == "src/renderer_host.rs"\n        and "RendererReply::Runtime(result) => result.map(|update| RuntimeHostUpdate" in old\n    )\n    expected = (1, 2) if renderer_runtime_mapping else (1,)\n    if count not in expected:\n        raise SystemExit(f"{path}: expected match count {expected}, found {count}: {old[:120]!r}")\n    p.write_text(text.replace(old, new, 1))'''
          if text.count(old) != 1:
              raise SystemExit("replace_once helper shape changed unexpectedly")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply retained Gecko-inspired architecture
        run: python3 tools/veil_087_gecko_architecture.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Release build
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo build --release --bins

      - name: Commit tested source
        run: |
          rm -f tools/veil_087_gecko_architecture.py
          git add Cargo.toml Cargo.lock src/net.rs src/engine.rs src/renderer_protocol.rs src/bin/veil_engine.rs src/renderer_host.rs src/runtime_interaction.rs src/main.rs
          git add -u -- tools/veil_087_gecko_architecture.py
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Adopt retained rendering and prioritized resource pipeline"
          git push origin HEAD:main
