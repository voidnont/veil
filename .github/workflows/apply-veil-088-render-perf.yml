name: Apply Veil 0.8.8 Render Performance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Apply retained display-list and viewport virtualization patch
        run: python3 tools/veil_088_render_perf.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Release build
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo build --release --bins

      - name: Commit tested source
        run: |
          rm -f tools/veil_088_render_perf.py
          git add Cargo.toml Cargo.lock src/display_list.rs src/lib.rs src/engine.rs src/renderer_protocol.rs src/bin/veil_engine.rs src/renderer_host.rs src/runtime_interaction.rs src/main.rs src/net.rs
          git add -u -- tools/veil_088_render_perf.py
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add retained display list and viewport virtualization"
          git push origin HEAD:main
