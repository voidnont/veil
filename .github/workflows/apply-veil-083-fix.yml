name: Apply Veil 0.8.3 Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Correct generated Rust backslash escape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/veil_083_patch.py')
          text = path.read_text()
          old = "            } else if byte == b'\\\\' {"
          new = "            } else if byte == b'\\\\\\\\' {"
          if old not in text:
              raise SystemExit('backslash escape target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply Veil 0.8.3 patch
        run: python3 tools/veil_083_patch.py

      - name: Normalize generated YouTube helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/loader.rs')
          lines = path.read_text().splitlines()
          fixed = []
          removed_marker = False
          removed_apostrophe = False
          for line in lines:
              if 'ytInitialData' in line and 'window[' in line:
                  removed_marker = True
                  continue
              if '&#39;' in line and '.replace' in line:
                  removed_apostrophe = True
                  continue
              fixed.append(line)
          if not removed_marker:
              raise SystemExit('generated ytInitialData window marker line not found')
          if not removed_apostrophe:
              raise SystemExit('generated apostrophe escape line not found')
          path.write_text('\n'.join(fixed) + '\n')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Commit tested source
        run: |
          rm -f tools/veil_083_patch.py
          rm -f .github/workflows/apply-veil-083-fix.yml
          git add -A
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Reveal top chrome and recover YouTube thumbnails"
          git push origin HEAD:main
