name: Veil CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect pending shell update
        id: detect
        shell: bash
        run: |
          if [ -f tools/veil-shell-main.patch ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.pending == 'true'

      - name: Integrate shell source
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          source = path.read_text()

          replacements = [
              (
                  'use veil_engine::style::{ComputedStyle, FontKind, JustifyContent, LayoutMode, TextAlign};\n\nconst HOME:',
                  'use veil_engine::style::{ComputedStyle, FontKind, JustifyContent, LayoutMode, TextAlign};\n\nmod shell_ui;\n\nconst HOME:',
              ),
              (
                  'const COLLAPSED_DOCK_WIDTH: f32 = 56.0;\nconst EXPANDED_DOCK_WIDTH: f32 = 248.0;',
                  'const COLLAPSED_DOCK_WIDTH: f32 = 54.0;\nconst EXPANDED_DOCK_WIDTH: f32 = 260.0;',
              ),
              (
                  'visuals.selection.bg_fill = Color32::from_rgba_unmultiplied(210, 118, 108, 78);',
                  'visuals.selection.bg_fill = Color32::from_rgba_unmultiplied(132, 102, 222, 72);',
              ),
              (
                  '''        egui::Frame::default()
                      .fill(Color32::from_rgba_unmultiplied(22, 23, 27, self.glass_alpha(extra_opacity)))
                      .stroke(egui::Stroke::new(1.0_f32, Color32::from_rgba_unmultiplied(255, 255, 255, 34)))
                      .corner_radius(16)
                      .inner_margin(8)''',
                  '''        egui::Frame::default()
                      .fill(Color32::from_rgba_unmultiplied(20, 20, 26, self.glass_alpha(extra_opacity)))
                      .stroke(egui::Stroke::new(1.0_f32, Color32::from_rgba_unmultiplied(255, 255, 255, 24)))
                      .corner_radius(14)
                      .inner_margin(6)''',
              ),
              (
                  '''        self.render_content(ctx);
                  self.render_sidebar(ctx);
                  self.render_address_pill(ctx);''',
                  '''        shell_ui::render_content(self, ctx);
                  shell_ui::render_sidebar(self, ctx);
                  shell_ui::render_address_pill(self, ctx);''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one shell integration match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)

          shell_path = Path("src/shell_ui.rs")
          shell = shell_path.read_text()
          shell_replacements = [
              ('const PANEL_BG: Color32 = Color32::from_rgba_unmultiplied(22, 22, 28, 246);\n', ''),
              ('const HOVER_BG: Color32 = Color32::from_rgba_unmultiplied(255, 255, 255, 14);\n', ''),
              ('const ACTIVE_BG: Color32 = Color32::from_rgba_unmultiplied(255, 255, 255, 22);\n', ''),
              ('const ACCENT_BG: Color32 = Color32::from_rgba_unmultiplied(132, 102, 222, 34);\n', ''),
              ('const BORDER: Color32 = Color32::from_rgba_unmultiplied(255, 255, 255, 24);\n', ''),
              ('.fill(PANEL_BG)', '.fill(Color32::from_rgba_unmultiplied(22, 22, 28, 246))'),
              ('.stroke(egui::Stroke::new(1.0, BORDER))', '.stroke(egui::Stroke::new(1.0_f32, Color32::from_rgba_unmultiplied(255, 255, 255, 24)))'),
              ('if active { ACCENT_BG } else { Color32::TRANSPARENT }', 'if active { Color32::from_rgba_unmultiplied(132, 102, 222, 34) } else { Color32::TRANSPARENT }'),
              ('if active { ACTIVE_BG } else { Color32::TRANSPARENT }', 'if active { Color32::from_rgba_unmultiplied(255, 255, 255, 22) } else { Color32::TRANSPARENT }'),
              ('                        BORDER\n', '                        Color32::from_rgba_unmultiplied(255, 255, 255, 24)\n'),
          ]
          for old, new in shell_replacements:
              count = shell.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one shell compatibility match, found {count}: {old[:80]!r}")
              shell = shell.replace(old, new, 1)

          shell = shell.replace('egui::Stroke::new(1.0,', 'egui::Stroke::new(1.0_f32,')
          shell_path.write_text(shell)
          PY

      - name: Test updated source
        if: steps.detect.outputs.pending == 'true'
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Build updated source
        if: steps.detect.outputs.pending == 'true'
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo build --release --bins

      - name: Promote tested source to main
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          rm -f tools/veil-shell-main.patch
          rm -rf tools/update-parts tools/source-update
          git add src/main.rs src/shell_ui.rs
          git add -u -- tools
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Veil Browser shell UI refresh"
          git push origin HEAD:main

  build:
    needs: promote
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release --bins

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force dist | Out-Null
          @'
          [Setup]
          AppId={{D9E74630-E1B8-4BE6-9D86-39BDA2817AC3}
          AppName=Veil Browser
          AppVersion=0.8.7
          AppPublisher=Veil
          DefaultDirName={localappdata}\Programs\Veil Browser
          DefaultGroupName=Veil Browser
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=dist
          OutputBaseFilename=Veil-Browser-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\veil-browser.exe
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          CloseApplications=yes
          RestartApplications=no
          SetupLogging=yes

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Files]
          Source: "target\release\veil-browser.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\veil-engine.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\Veil Browser"; Filename: "{app}\veil-browser.exe"; WorkingDir: "{app}"
          Name: "{autoprograms}\Veil Browser (Safe UI)"; Filename: "{app}\veil-browser.exe"; Parameters: "--safe-ui"; WorkingDir: "{app}"
          Name: "{userdesktop}\Veil Browser"; Filename: "{app}\veil-browser.exe"; WorkingDir: "{app}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\veil-browser.exe"; Description: "Launch Veil Browser"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path veil-installer.iss -Encoding UTF8

          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($command) { $compiler = $command.Source }
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not found.' }
          & $compiler veil-installer.iss
          if (-not (Test-Path 'dist\Veil-Browser-Setup.exe')) { throw 'Installer was not produced.' }

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: veil-windows-installer
          path: dist/Veil-Browser-Setup.exe
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: veil-${{ runner.os }}
          path: |
            target/release/veil-browser*
            target/release/veil-engine*
          if-no-files-found: error
