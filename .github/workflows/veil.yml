name: Veil CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect pending shell update
        id: detect
        shell: bash
        run: |
          if [ -f tools/veil-shell-main.patch ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.pending == 'true'

      - name: Apply shell update
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          git apply --check tools/veil-shell-main.patch
          git apply tools/veil-shell-main.patch

      - name: Test updated source
        if: steps.detect.outputs.pending == 'true'
        run: cargo test --all-targets

      - name: Build updated source
        if: steps.detect.outputs.pending == 'true'
        run: cargo build --release --bins

      - name: Promote tested source to main
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          rm -f tools/veil-shell-main.patch
          rm -rf tools/update-parts tools/source-update
          git add -A
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Veil Browser shell UI refresh"
          git push origin HEAD:main

  build:
    needs: promote
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release --bins

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: veil-${{ runner.os }}
          path: |
            target/release/veil-browser*
            target/release/veil-engine*
          if-no-files-found: error
