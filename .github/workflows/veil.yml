name: Veil CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect pending source update
        id: detect
        shell: bash
        run: |
          if compgen -G "tools/update-parts/part-*.gz" > /dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Install Rust
        if: steps.detect.outputs.pending == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Assemble and verify source update
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          cat tools/update-parts/part-*.gz > /tmp/veil-update.patch.gz.b64
          base64 --decode /tmp/veil-update.patch.gz.b64 > /tmp/veil-update.patch.gz
          echo "3724f8f80bb578ecc70385a48ab23da5798e0437a396553d18bbce6e7aa21bf8  /tmp/veil-update.patch.gz" | sha256sum -c -
          gzip -dc /tmp/veil-update.patch.gz > /tmp/veil-update.patch
          echo "8a768c5ff8203f80562b61c8dea506d59ffac11a15638fb55af5fa0f31dacf98  /tmp/veil-update.patch" | sha256sum -c -
          git apply --check /tmp/veil-update.patch
          git apply /tmp/veil-update.patch

      - name: Test updated source
        if: steps.detect.outputs.pending == 'true'
        run: cargo test --all-targets

      - name: Build updated source
        if: steps.detect.outputs.pending == 'true'
        run: cargo build --release --bins

      - name: Promote tested source
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          rm -rf tools/update-parts
          git add -A
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Veil Browser 0.8.1 runtime and UI update"
          git push origin HEAD:main

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release --bins

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: veil-${{ runner.os }}
          path: |
            target/release/veil-browser*
            target/release/veil-engine*
          if-no-files-found: error

# Retry staging after all verified parts are present.
