name: Veil Shell Color Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch egui color constants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/shell_ui.rs')
          source = path.read_text()
          replacements = {
              'Color32::from_rgba_unmultiplied(18, 19, 24, 248)': 'Color32::from_rgba_premultiplied(18, 19, 24, 248)',
              'Color32::from_rgba_unmultiplied(20, 21, 27, 250)': 'Color32::from_rgba_premultiplied(20, 21, 27, 250)',
              'Color32::from_rgba_unmultiplied(255, 255, 255, 10)': 'Color32::from_rgba_premultiplied(10, 10, 10, 10)',
              'Color32::from_rgba_unmultiplied(255, 255, 255, 18)': 'Color32::from_rgba_premultiplied(18, 18, 18, 18)',
              'Color32::from_rgba_unmultiplied(255, 255, 255, 22)': 'Color32::from_rgba_premultiplied(22, 22, 22, 22)',
              'Color32::from_rgba_unmultiplied(150, 121, 234, 34)': 'Color32::from_rgba_premultiplied(20, 16, 31, 34)',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/shell_ui.rs; then
            echo "No compatibility changes needed."
            exit 0
          fi
          git add src/shell_ui.rs
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix Veil shell color constants"
          git push origin HEAD:main
