name: Apply Veil Glass Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Fix patch matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/veil_glass_patch.py')
          source = path.read_text()
          old = 'shell = replace_once(shell, "    let sidebar = sidebar_width(app, ctx);", "    let sidebar = COLLAPSED_DOCK_WIDTH;", "stable content inset")'
          new = '''shell = replace_once(
              shell,
              "pub(crate) fn render_content(app: &mut VeilApp, ctx: &egui::Context) {\\n    let sidebar = sidebar_width(app, ctx);",
              "pub(crate) fn render_content(app: &mut VeilApp, ctx: &egui::Context) {\\n    let sidebar = COLLAPSED_DOCK_WIDTH;",
              "stable content inset",
          )'''
          if source.count(old) != 1:
              raise SystemExit(f'patch matcher anchor count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Apply source patch
        run: python3 tools/veil_glass_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Commit tested source
        run: |
          rm -f tools/veil_glass_patch.py tools/.veil-glass-fix-trigger
          rm -f .github/workflows/veil-glass-youtube-fix.yml .github/workflows/apply-veil-glass-fix.yml
          git add -A
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Harden YouTube loading and restore glass shell"
          git push origin HEAD:main
