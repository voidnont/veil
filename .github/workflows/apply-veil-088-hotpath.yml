name: Apply Veil 0.8.8 Hot Path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Apply hot-path optimizations
        run: python3 tools/veil_088_hotpath.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo test --all-targets

      - name: Release build
        env:
          CARGO_TARGET_DIR: /tmp/veil-target
        run: cargo build --release --bins

      - name: Commit tested source
        run: |
          rm -f tools/veil_088_hotpath.py
          git add src/display_list.rs src/main.rs src/bin/veil_engine.rs src/runtime_interaction.rs
          git add -u -- tools/veil_088_hotpath.py
          git config user.name "veil-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Cut runtime and retained-paint hot-path overhead"
          git push origin HEAD:main
